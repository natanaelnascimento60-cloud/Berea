name: Gerar APK Berea
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar projeto para build
        run: |
          chmod +x gradlew || true
          if [ -f "app/build.gradle.kts" ]; then
            sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' app/build.gradle.kts
          fi
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "GEMINI_API_KEY=placeholder" > .env.example

      - name: Compilar APK de Teste
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Enviar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Berea-App-APK
          path: app/build/outputs/apk/debug/*.apk
          
